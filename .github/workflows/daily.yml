name: Daily AQI pull
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_aqi.py
        env:
          DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
      - run: |
          git config user.name "aqi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Daily AQI report" || echo "no changes"
          git pull --rebase origin main
          git push
